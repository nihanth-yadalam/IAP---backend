name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  lint:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install Ruff
        run: pip install ruff
        
      - name: Run Ruff Format Check
        run: ruff format --check .
        
      - name: Run Ruff Linter
        run: ruff check .

  security:
    name: Security Scanning (Bandit & Safety)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install Bandit and Safety
        run: pip install bandit safety
        
      - name: Run Bandit (AST-based static analyzer for Python)
        # Exclude tests and alembic directories from bandit scans
        run: bandit -r . -x tests/,alembic/ -ll
        
      - name: Run Safety (Dependency scanner)
        # Assuming requirements.txt is at the root
        run: safety check -r requirements.txt --full-report || true # Using || true so early builds don't fail immediately on known minor CVEs, but logs them. Remove || true for strict mode.

  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    needs: [lint]
    
    # Spin up a PostgreSQL service container for testing
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: iap_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Pytest
        env:
          # Use the Postgres service container URL instead of SQLite
          TEST_DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/iap_test_db
          SECRET_KEY: test_secret_key
        run: pytest -v --disable-warnings
