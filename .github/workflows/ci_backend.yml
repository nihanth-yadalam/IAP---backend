name: IAP Backend CI

on:
  push:
    branches: [main, backend_v1]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend ────────────────────────────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    env:
      BACKEND_ENV: ${{ secrets.BACKEND_ENV }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file from secret
        run: echo "$BACKEND_ENV" > .env

      - name: Run unit tests
        env:
          PYTHONPATH: "."
        run: |
          pytest tests/core/test_security.py \
                 tests/core/test_timezone.py \
                 tests/services/test_calendar.py \
                 --noconftest -v --tb=short

      - name: Run integration tests
        env:
          PYTHONPATH: "."
        run: |
          pytest tests/integration/ --confcutdir=tests -v --tb=short

      - name: Run regression tests
        env:
          PYTHONPATH: "."
        run: |
          pytest tests/regression/ --confcutdir=tests -v --tb=short

      - name: Start server (smoke test)
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          sleep 5

          # Health-check
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health || true)

          kill $SERVER_PID 2>/dev/null || true

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Server responded with HTTP $STATUS"
          else
            echo "❌ Server responded with HTTP $STATUS"
            exit 1
          fi
