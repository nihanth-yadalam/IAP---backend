name: IAP Backend E2E Tests

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Override backend URL (leave empty to use secret)"
        required: false
        type: string

jobs:
  e2e:
    name: E2E Tests (Live Infrastructure)
    runs-on: ubuntu-latest

    env:
      BACKEND_LIVE_URL: ${{ inputs.backend_url || secrets.BACKEND_LIVE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run E2E tests
        run: |
          pytest tests/e2e/ -v --tb=short
